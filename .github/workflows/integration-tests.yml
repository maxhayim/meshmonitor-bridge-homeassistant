name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-client:
    # api.py's own tests, no Home Assistant core test harness involved.
    # Deliberately NOT combined with the coordinator job below:
    # pytest-homeassistant-custom-component installs a strict, session-wide
    # thread-cleanup fixture that misfires on plain aiohttp/aioresponses
    # tests merely by being present in the same environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev-integration.txt
      - run: python -m pytest tests/test_meshmonitor_integration/test_api.py -v

  coordinator:
    # Needs real Home Assistant core objects (ConfigEntry, DataUpdateCoordinator,
    # the `hass` test fixture) via pytest-homeassistant-custom-component.
    #
    # --asyncio-mode=auto is required here, not optional: pytest-homeassistant-
    # custom-component's `hass` fixture is a plain @pytest.fixture wrapping an
    # async generator, not a @pytest_asyncio.fixture. Under pytest-asyncio's
    # default "strict" mode that fixture is never awaited at all -- pytest
    # hands the test a raw, unresolved async_generator object instead of a
    # real hass instance. This was latent and invisible in test_coordinator.py
    # (its tests pass hass through without dereferencing it deeply enough to
    # notice); test_config_flow.py's `hass.config_entries.flow...` calls
    # surfaced it immediately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev-ha.txt
      - run: python -m pytest tests/test_meshmonitor_integration/test_coordinator.py tests/test_meshmonitor_integration/test_config_flow.py -v --asyncio-mode=auto
