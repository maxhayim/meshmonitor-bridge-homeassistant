name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Scoped explicitly: tests/test_meshmonitor_integration/ belongs to
        # the separate native integration (see integration-tests.yml) and
        # needs its own, different dependency sets installed.
        run: python -m pytest tests/test_bridge.py -v --asyncio-mode=auto
